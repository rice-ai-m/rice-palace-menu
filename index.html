<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Rice Palace Menu</title>
    
    <!-- مكتبة StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    
    <!-- مكتبة FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ربط ملف التنسيقات الخارجي -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="tutorial-overlay" id="tutorial">
        <div class="hand-icon"><i class="fa-regular fa-hand-pointer"></i></div>
        <div class="tutorial-text">Swipe to explore menu</div>
    </div>

    <!-- منطقة المنيو -->
    <div id="zoom-wrapper">
        <div class="container" id="book-container">
            <div id="flipbook">
                <div class="page"><img src="Beige.png" alt="Cover"></div>
                <div class="page"><img src="AppetizerAndSalad.png" alt="Appetizers"></div>
                <div class="page"><img src="Steak.png" alt="Steak"></div>
                <div class="page"><img src="Seafood.png" alt="Seafood"></div>
                <div class="page"><img src="Sandwich.png" alt="Sandwich"></div>
                <div class="page"><img src="Breakfast.png" alt="Breakfast"></div>
            </div>
        </div>
    </div>

    <!-- شريط التحكم السفلي -->
    <div class="bottom-toolbar">
        <div class="toolbar-group">
            <button class="tool-btn" id="btn-zoom-in" onclick="changeZoom(0.5)"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
            <button class="tool-btn" id="btn-zoom-out" onclick="changeZoom(-0.5)"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            <button class="tool-btn" id="btn-sound" onclick="toggleSound()"><i class="fa-solid fa-volume-high" id="sound-icon"></i></button>
        </div>

        <div class="toolbar-group">
            <i class="fa-solid fa-angle-left nav-arrow" id="btn-prev"></i>
            <div class="page-indicator-pill" id="counter">1 / 6</div>
            <i class="fa-solid fa-angle-right nav-arrow" id="btn-next"></i>
        </div>

        <div class="toolbar-group">
            <button class="tool-btn" onclick="toggleFullScreen()"><i class="fa-solid fa-expand"></i></button>
        </div>
    </div>

    <!-- ربط ملف البرمجة الخارجي -->
    <script src="script.js"></script>
</body>
</html>
